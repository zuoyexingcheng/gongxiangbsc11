services:
  - type: web
    name: bsc-timeline
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        value: admin123
      - key: DATABASE_URL
        fromDatabase:
          name: jingou-postgres
          property: connectionString

databases:
  - name: jingou-postgres
    databaseName: jingou_reviews
    user: jingou_reviews_user
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
